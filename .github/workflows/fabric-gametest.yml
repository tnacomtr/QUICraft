# SPDX-License-Identifier: GPL-3.0-or-later
# Fabric client gametests (docs/platforms/fabric.md): a real client and an in-process dedicated
# server with the mod, headless under Xvfb, for every supported game version.
name: fabric-gametest

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gametest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { module: fabric-1.21.11, minecraft: "", fabric_api: "" }
          - { module: fabric-26x, minecraft: "26.1", fabric_api: "0.145.1+26.1" }
          - { module: fabric-26x, minecraft: "26.1.1", fabric_api: "0.145.4+26.1.1" }
          - { module: fabric-26x, minecraft: "", fabric_api: "" } # 26.1.2, the build version
          - { module: fabric-26x, minecraft: "26.2", fabric_api: "0.161.0+26.2" }
          - { module: fabric-26x, minecraft: "26.3", fabric_api: "0.162.0+26.3" }
    name: ${{ matrix.module }} ${{ matrix.minecraft || 'default' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      # QUICraft's patched Netty QUIC jars (natives/); cached, built in Docker on a miss.
      - uses: ./.github/actions/netty-quic-linux
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Client gametests
        env:
          MODULE: ${{ matrix.module }}
          MINECRAFT: ${{ matrix.minecraft }}
          FABRIC_API: ${{ matrix.fabric_api }}
        run: |
          args=()
          if [ -n "$MINECRAFT" ]; then
            args+=("-P$MODULE.minecraft=$MINECRAFT" "-P$MODULE.fabricApi=$FABRIC_API")
          fi
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew ":$MODULE:runClientGameTest" "${args[@]}"
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-${{ matrix.module }}-${{ matrix.minecraft || 'default' }}
          path: |
            ${{ matrix.module }}/build/run/clientGameTest/screenshots/
            ${{ matrix.module }}/build/run/clientGameTest/logs/
            ${{ matrix.module }}/build/run/clientGameTest/crash-reports/
