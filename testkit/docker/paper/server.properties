# Testkit backend behind Velocity. Keys not listed keep Paper's defaults.
server-port=25565
# Velocity does online-mode auth and forwards the profile (modern forwarding).
online-mode=false
enforce-secure-profile=false
enable-query=false
# Fixed world so runs are comparable.
level-seed=quicraft-testkit
view-distance=8
simulation-distance=8
# Creative + peaceful: the bench player must never die, take damage or get flagged for flying.
gamemode=creative
force-gamemode=true
difficulty=peaceful
allow-flight=true
spawn-protection=0
max-players=50
network-compression-threshold=256
