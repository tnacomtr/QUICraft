# SPDX-License-Identifier: GPL-3.0-or-later
# Testkit Fabric server, joined directly by the bench client. Keys not listed keep the defaults.
server-port=25565
# Set from FABRIC_ONLINE_MODE by the entrypoint.
online-mode=false
enforce-secure-profile=false
enable-query=false
# Fixed world so runs are comparable.
level-seed=quicraft-testkit
view-distance=8
simulation-distance=8
# Creative + peaceful: the bench player must never die, take damage or get flagged for flying.
gamemode=creative
force-gamemode=true
difficulty=peaceful
allow-flight=true
spawn-protection=0
max-players=50
network-compression-threshold=256
