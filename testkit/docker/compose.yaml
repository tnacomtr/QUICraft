# Testkit: bench client -> Velocity -> Paper, plus a mock Mojang session server.
# Normally driven by testkit/run-baseline.sh; see testkit/README.md.
name: quicraft-testkit

services:
  mocksession:
    build:
      context: ..
      dockerfile: docker/bench/Dockerfile
    image: quicraft-testkit-bench
    command: ["mocksession", "--port", "8080"]
    networks: [front, back]

  paper:
    build: paper
    image: quicraft-testkit-paper
    # No volume: the world is pre-generated into the image, so every `up` starts from the
    # same world and anything a run changes is gone after `down`.
    networks: [back]
    stop_grace_period: 60s

  velocity:
    build:
      context: velocity
      # The plugin jar, after `./gradlew :velocity:testkitPlugin`.
      additional_contexts:
        quicraft: ../../velocity/build/testkit
    image: quicraft-testkit-velocity
    environment:
      VELOCITY_ONLINE_MODE: ${VELOCITY_ONLINE_MODE:-true}
      # false: plain Velocity, for a baseline without the plugin installed.
      QUICRAFT_PLUGIN: ${QUICRAFT_PLUGIN:-true}
    networks: [front, back]
    depends_on: [paper, mocksession]
    stop_grace_period: 30s

  # One-shot client: `docker compose run --rm -e NETEM_PROFILE=loss bench bench --host velocity ...`
  bench:
    image: quicraft-testkit-bench
    profiles: [bench]
    cap_add: [NET_ADMIN]
    environment:
      NETEM_PROFILE: ${NETEM_PROFILE:-clean}
      HOST_UID: ${HOST_UID:-0}
      HOST_GID: ${HOST_GID:-0}
    volumes:
      - ../results:/results
    networks: [front]
    depends_on: [velocity]

  # Transport benchmark server (testkit/run-transport-bench.sh): TCP and QUIC Reno/CUBIC/BBR.
  transportserver:
    image: quicraft-testkit-bench
    profiles: [transport]
    command: ["transport-server", "--port", "30000", "--fingerprint-file", "/results/transport-fp.txt"]
    environment:
      HOST_UID: ${HOST_UID:-0}
      HOST_GID: ${HOST_GID:-0}
    volumes:
      - ../results:/results
    networks: [front]

networks:
  # Player side: the only link netem shapes.
  front: {}
  # Proxy to backend: stays clean, like a LAN.
  back: {}
