# SPDX-License-Identifier: GPL-3.0-or-later
#
# Every version bump here re-runs the license check (./gradlew checkLicense).
# Netty upgrades also need the BoringSSL pin re-checked; see CLAUDE.md "Licensing".

[versions]
# 4.2.19.Final: BoringSSL d03dbc3e (2026-05-12, Apache-2.0), quiche be47c501, Java 8 bytecode.
netty = "4.2.19.Final"
# Oldest game/platform Netty per bridge (docs/version-matrix.md); compile-only, never shipped.
netty-game41 = "4.1.82.Final"
netty-game42 = "4.2.1.Final"
junit = "5.14.4"
slf4j = "2.0.17"
gson = "2.11.0"
# Testkit only. One MCProtocolLib release per tested protocol; see docs/version-matrix.md.
mcprotocollib = "26.1-1"
# Velocity API (MIT). The proxy jar (GPL-3.0) is pinned by sha256 in velocity/build.gradle.kts.
velocity = "4.2.0"

[libraries]
netty-bom = { module = "io.netty:netty-bom", version.ref = "netty" }
netty-quic-classes = { module = "io.netty:netty-codec-classes-quic" }
netty-quic-native = { module = "io.netty:netty-codec-native-quic", version.ref = "netty" }
netty41-transport = { module = "io.netty:netty-transport", version.ref = "netty-game41" }
netty42-transport = { module = "io.netty:netty-transport", version.ref = "netty-game42" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
mcprotocollib = { module = "org.geysermc.mcprotocollib:protocol", version.ref = "mcprotocollib" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }
